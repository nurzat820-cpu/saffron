<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 — saffron</title>
  <style>
:root{--color-primary:#0066cc;--color-primary-focus:#0071e3;--color-primary-on-dark:#2997ff;--color-canvas:#fff;--color-canvas-warm:#f5f0e8;--color-surface-tile-1:#272729;--color-surface-black:#000;--color-ink:#1d1d1f;--color-body-on-dark:#fff;--color-body-muted:#ccc;--color-ink-muted-80:#333;--color-ink-muted-48:#7a7a7a;--color-hairline:#e0e0e0;--color-on-primary:#fff;--font-display:"SF Pro Display",system-ui,-apple-system,BlinkMacSystemFont,"Inter",sans-serif;--font-text:"SF Pro Text",system-ui,-apple-system,BlinkMacSystemFont,"Inter",sans-serif;--space-xxs:4px;--space-xs:8px;--space-sm:12px;--space-md:17px;--space-lg:24px;--space-xl:32px;--space-xxl:48px;--space-section:80px;--rounded-lg:18px;--rounded-pill:9999px;--shadow-product:3px 5px 30px rgba(0,0,0,.22)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font-text);font-size:17px;font-weight:400;line-height:1.47;letter-spacing:-.374px;color:var(--color-ink);background:var(--color-canvas)}
a{color:var(--color-primary);text-decoration:none}a:hover{text-decoration:underline}
.hero-display{font-family:var(--font-display);font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-.28px}
.lead{font-family:var(--font-display);font-size:28px;font-weight:400;line-height:1.14;letter-spacing:.196px}
.tagline{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.19;letter-spacing:.231px}
.body-strong{font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-.374px}
.caption-strong{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-.224px}
.fine-print{font-size:12px;font-weight:400;line-height:1;letter-spacing:-.12px}
.global-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--color-surface-black);height:44px}
.nav-inner{max-width:1440px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-lg)}
.nav-logo{color:var(--color-body-on-dark);font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.28px;text-decoration:none}.nav-logo:hover{text-decoration:none}
.nav-links{display:flex;gap:var(--space-xl)}
.nav-link{color:var(--color-body-on-dark);font-size:12px;font-weight:400;line-height:1;letter-spacing:-.12px;text-decoration:none;opacity:.8;transition:opacity .2s}.nav-link:hover{opacity:1;text-decoration:none}
.nav-actions{display:flex;align-items:center;gap:var(--space-md)}
.nav-icon-btn{background:none;border:none;color:var(--color-body-on-dark);cursor:pointer;padding:var(--space-xs);display:flex;align-items:center;justify-content:center;opacity:.8;transition:opacity .2s}.nav-icon-btn:hover{opacity:1}
.nav-hamburger{display:none;flex-direction:column;gap:4px;background:none;border:none;cursor:pointer;padding:var(--space-xs)}
.nav-hamburger span{display:block;width:16px;height:1.5px;background:var(--color-body-on-dark);transition:transform .3s,opacity .3s}
.nav-hamburger.active span:first-child{transform:translateY(2.75px) rotate(45deg)}
.nav-hamburger.active span:last-child{transform:translateY(-2.75px) rotate(-45deg)}
.tile{width:100%;padding:var(--space-section) var(--space-lg);text-align:center}
.tile-warm{background:var(--color-canvas-warm);color:var(--color-ink)}
.tile-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:var(--space-sm)}
.tile-inner-wide{max-width:980px}
.tile-muted{color:var(--color-ink-muted-48)}
.btn{display:inline-block;font-family:var(--font-text);font-size:17px;font-weight:400;line-height:1;padding:11px 22px;border-radius:var(--rounded-pill);text-decoration:none;cursor:pointer;transition:transform .05s;border:none}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
.contact-main{padding-top:calc(44px + var(--space-section))}
.contact-layout{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xxl);max-width:860px;width:100%;margin-top:var(--space-lg);align-items:start}
.contact-side{display:flex;flex-direction:column;gap:var(--space-lg)}
.contact-side .contact-info-card{text-align:left}
.contact-side .contact-info-icon{background:rgba(0,0,0,.06);color:var(--color-ink);margin:0 0 var(--space-sm) 0}
.contact-side .contact-info-card .tagline{color:var(--color-ink-muted-48)}
.contact-side .contact-info-card .body-strong{color:var(--color-ink)}
.contact-form{max-width:600px;width:100%;display:flex;flex-direction:column;gap:var(--space-md)}
.contact-field{width:100%;font-family:var(--font-text);font-size:17px;font-weight:400;line-height:1.47;color:var(--color-ink);background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--rounded-pill);padding:12px 20px;height:44px;outline:none;transition:border-color .2s}
.contact-field:focus{border-color:var(--color-primary);outline:2px solid var(--color-primary-focus);outline-offset:-2px}
.contact-field::placeholder{color:var(--color-ink-muted-48)}
textarea.contact-field{height:auto;min-height:120px;border-radius:var(--rounded-lg);resize:vertical}
.contact-form .btn{align-self:flex-start}
.contact-info-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.08);margin:0 auto var(--space-md);display:flex;align-items:center;justify-content:center;font-size:24px}
.footer{background:var(--color-canvas-warm);padding:64px var(--space-lg)}
.footer-inner{max-width:980px;margin:0 auto}
.footer-columns{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-xl);margin-bottom:var(--space-xxl)}
.footer-col-title{color:var(--color-ink);margin-bottom:var(--space-sm)}
.footer-links{list-style:none}.footer-links li{margin-bottom:0}
.footer-links a{color:var(--color-ink-muted-80);font-size:17px;font-weight:400;line-height:2.41;text-decoration:none}.footer-links a:hover{text-decoration:underline}
.footer-legal{border-top:1px solid var(--color-hairline);padding-top:var(--space-lg);text-align:left}
.footer-legal-text{color:var(--color-ink-muted-48)}
@media(max-width:833px){.nav-links{display:none;position:absolute;top:44px;left:0;right:0;background:var(--color-surface-black);flex-direction:column;padding:var(--space-lg);gap:var(--space-lg)}.nav-links.open{display:flex}.nav-hamburger{display:flex}.footer-columns{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.hero-display{font-size:34px}.lead{font-size:22px}.tile{padding:var(--space-xxl) var(--space-lg)}.footer-columns{grid-template-columns:1fr;gap:var(--space-lg)}.contact-layout{grid-template-columns:1fr;gap:var(--space-xl)}}
@media(max-width:419px){.hero-display{font-size:28px}}
  </style>
</head>
<body>

  <nav class="global-nav" id="globalNav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">saffron</a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">首页</a>
        <a href="story.html" class="nav-link">品牌故事</a>
        <a href="about.html" class="nav-link">关于我们</a>
        <a href="contact.html" class="nav-link">联系我们</a>
      </div>
      <div class="nav-actions">
        <button class="nav-icon-btn" aria-label="搜索"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M10.5 10.5L15 15" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <button class="nav-icon-btn" aria-label="购物袋"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12l-1 10H3L2 4z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M5 4V3a3 3 0 016 0v1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <button class="nav-hamburger" id="navHamburger" aria-label="菜单"><span></span><span></span></button>
      </div>
    </div>
  </nav>

  <section class="tile tile-warm contact-main" id="contactMain">
    <div class="tile-inner tile-inner-wide">
      <h1 class="hero-display">联系我们</h1>
      <p class="lead tile-muted">我们随时倾听你的声音</p>
      <div class="contact-layout">
        <form class="contact-form" action="#" method="post">
          <input type="text" class="contact-field" name="name" placeholder="姓名" required>
          <input type="email" class="contact-field" name="email" placeholder="邮箱" required>
          <textarea class="contact-field" name="message" placeholder="留言" rows="5" required></textarea>
          <button type="submit" class="btn btn-primary">发送留言</button>
        </form>
        <div class="contact-side">
          <div class="contact-info-card">
            <div class="contact-info-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <p class="tagline">客服电话</p>
            <p class="body-strong">180-9910-8380</p>
          </div>
          <div class="contact-info-card">
            <div class="contact-info-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M22 4L12 13 2 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <p class="tagline">电子邮箱</p>
            <p class="body-strong">hello@saffron.com</p>
          </div>
          <div class="contact-info-card">
            <div class="contact-info-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <p class="tagline">微信</p>
            <p class="body-strong">nurzat</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer">
    <div class="footer-inner">
      <div class="footer-columns">
        <div class="footer-col"><h4 class="caption-strong footer-col-title">产品</h4><ul class="footer-links"><li><a href="#">跑鞋</a></li><li><a href="#">篮球鞋</a></li><li><a href="#">休闲系列</a></li><li><a href="#">配件</a></li></ul></div>
        <div class="footer-col"><h4 class="caption-strong footer-col-title">品牌</h4><ul class="footer-links"><li><a href="about.html">关于我们</a></li><li><a href="story.html">品牌故事</a></li><li><a href="#">可持续发展</a></li></ul></div>
        <div class="footer-col"><h4 class="caption-strong footer-col-title">支持</h4><ul class="footer-links"><li><a href="#">帮助中心</a></li><li><a href="#">退换货政策</a></li><li><a href="contact.html">联系我们</a></li></ul></div>
        <div class="footer-col"><h4 class="caption-strong footer-col-title">关注我们</h4><ul class="footer-links"><li><a href="#">Instagram</a></li><li><a href="#">微博</a></li><li><a href="#">微信</a></li></ul></div>
      </div>
      <div class="footer-legal"><p class="fine-print footer-legal-text">&copy; 2026 saffron. All rights reserved. Be yourself.</p></div>
    </div>
  </footer>

  <script>
const hamburger=document.getElementById('navHamburger'),navLinks=document.getElementById('navLinks');
if(hamburger&&navLinks){hamburger.addEventListener('click',()=>{hamburger.classList.toggle('active');navLinks.classList.toggle('open')});navLinks.querySelectorAll('a').forEach(l=>{l.addEventListener('click',()=>{hamburger.classList.remove('active');navLinks.classList.remove('open')})})}
  </script>
</body>
</html>
