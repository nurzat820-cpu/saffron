  <!-- Contact (tile-warm) -->
  <section class="tile tile-warm contact-main" id="contactMain">
    <div class="tile-inner tile-inner-wide">
      <h1 class="hero-display">联系我们</h1>
      <p class="lead tile-muted">我们随时倾听你的声音</p>
      <div class="contact-layout">
        <form class="contact-form" action="#" method="post">
          <input type="text" class="contact-field" name="name" placeholder="姓名" required>
          <input type="email" class="contact-field" name="email" placeholder="邮箱" required>
          <textarea class="contact-field" name="message" placeholder="留言" rows="5" required></textarea>
          <button type="submit" class="btn btn-primary">发送留言</button>
        </form>
        <div class="contact-side">
          <div class="contact-info-card">
            <div class="contact-info-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="tagline">客服电话</p>
            <p class="body-strong">180-9910-8380</p>
          </div>
          <div class="contact-info-card">
            <div class="contact-info-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/>
                <path d="M22 4L12 13 2 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="tagline">电子邮箱</p>
            <p class="body-strong">hello@saffron.com</p>
          </div>
          <div class="contact-info-card">
            <div class="contact-info-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="tagline">微信</p>
            <p class="body-strong">nurzat</p>
          </div>
        </div>
      </div>
    </div>
  </section>
